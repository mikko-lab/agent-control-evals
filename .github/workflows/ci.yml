name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: harness smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ACE_SUT_CHECKOUT: ${{ github.workspace }}/.work/envs/sut-verify/checkout
      ACE_SUT_BUILD: ${{ github.workspace }}/.work/envs/sut-verify/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 1. install
        run: npm ci
      - name: 2. typecheck
        run: npm run typecheck
      - name: 3. build (no separate linter in v0.1; tsc strict is the lint gate)
        run: npm run build
      - name: 4. unit tests (SUT-dependent tests are skipped here and run in step 11)
        run: node --test --test-concurrency=1 "dist/test/**/*.test.js"
        env:
          ACE_SUT_CHECKOUT: ""
          ACE_SUT_BUILD: ""
      - name: 5. oracle dependency-boundary check
        run: node dist/src/cli.js oracle-boundary
      - name: 6. SUT checkout SHA verification (read-only clone, pinned SHA, clean tree, SUT's own npm run verify)
        run: node dist/src/cli.js sut-verify --run-sut-tests
      - name: 7-8. deterministic smoke corpus + golden SHA + committed bytes
        run: node dist/src/cli.js golden
      - name: 9. runtime smoke evaluation (with observation determinism)
        run: node dist/src/cli.js evaluate --profile smoke --boundary runtime --mutations none --check-observation-determinism --out out/runtime-smoke
      - name: 10. component smoke evaluation (with observation determinism)
        run: node dist/src/cli.js evaluate --profile smoke --boundary component --mutations none --check-observation-determinism --out out/component-smoke
      - name: 11. adapter contract tests (fake adapters + real pinned ACS adapter + protocol schemas)
        run: node --test --test-concurrency=1 dist/test/adapter-contract.test.js dist/test/sut-integration.test.js dist/test/schemas.test.js
      - name: 12. mutation reachability validation
        run: node dist/src/cli.js reachability > out/reachability.json
      - name: 13. runtime mutation smoke
        run: node dist/src/cli.js evaluate --profile smoke --boundary runtime --mutations runtime --out out/runtime-mutation-smoke
      - name: 14. component mutation smoke
        run: node dist/src/cli.js evaluate --profile smoke --boundary component --mutations component --out out/component-mutation-smoke
      - name: 15. report schema validation
        run: |
          for r in out/*/report.json; do node dist/src/cli.js validate-report --file "$r"; done
      - name: 16. determinism check (independent generations, byte-for-byte)
        run: |
          node dist/src/cli.js generate --profile smoke --out out/det-a
          node dist/src/cli.js generate --profile smoke --out out/det-b
          cmp out/det-a/corpus.jsonl out/det-b/corpus.jsonl
          cmp out/det-a/corpus.jsonl corpus/smoke.jsonl
          node dist/src/cli.js generate --profile full --out out/det-full-a
          node dist/src/cli.js generate --profile full --out out/det-full-b
          cmp out/det-full-a/corpus.jsonl out/det-full-b/corpus.jsonl
          rm -rf out/det-*
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-node${{ matrix.node }}
          path: |
            out/**/report.json
            out/**/summary.md
            out/**/corpus-manifest.json
            out/reachability.json
          if-no-files-found: warn

  automotive:
    name: automotive assurance (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 1. install
        run: npm ci
      - name: 2. build
        run: npm run build
      - name: 3. automotive reference-agent evaluation (harness self-test, golden-checked corpus)
        run: node dist/src/automotive-cli.js evaluate --profile smoke --reference-agent --out out/automotive/reference
      - name: 4. automotive report and manifest schema validation
        run: |
          node dist/src/automotive-cli.js validate-report --file out/automotive/reference/report.json
          node dist/src/automotive-cli.js validate-manifest --file out/automotive/reference/manifest.json
      - name: 5. automotive synthetic fault sensitivity
        run: node dist/src/automotive-cli.js faults --profile smoke --out out/automotive/faults-a
      - name: 6. automotive fault report schema validation
        run: node dist/src/automotive-cli.js validate-fault-report --file out/automotive/faults-a/fault-sensitivity.json
      - name: 7. automotive synthetic fault sensitivity determinism (independent rerun, recursive byte comparison)
        run: |
          node dist/src/automotive-cli.js faults --profile smoke --out out/automotive/faults-b
          diff -r out/automotive/faults-a out/automotive/faults-b
          rm -rf out/automotive/faults-b
      - name: upload automotive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automotive-reports-node${{ matrix.node }}
          path: |
            out/automotive/reference/**
            out/automotive/faults-a/**
          if-no-files-found: warn

  revocation:
    name: revocation containment (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: corpus, oracle, evaluator, sensitivity and CLI contract tests
        run: node --test --test-concurrency=1 dist/test/revocation/*.test.js
      - name: golden corpus, baseline and fixed-witness sensitivity gate
        run: npm run ace:revocation -- self-test --out out/revocation-a
      - name: independent rerun and complete bundle byte comparison
        run: |
          npm run ace:revocation -- self-test --out out/revocation-b
          diff -r out/revocation-a out/revocation-b
      - name: evaluator regression mutants are caught by content
        run: node dist/scripts/revocation-regressions.js --out out/revocation-a-regressions.json
      - name: upload revocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revocation-reports-node${{ matrix.node }}
          path: |
            out/revocation-a/**
            out/revocation-a-regressions.json
          if-no-files-found: warn

  external-actions:
    name: external actions P1a synthetic validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 1. typecheck and build (no sudo, no network namespaces, no guard run in P1a)
        run: |
          npm run typecheck
          npm run build
      - name: 2. oracle import boundary of the external-actions track
        run: node dist/src/external-actions-cli.js oracle-boundary
      - name: 3. evaluator, oracle, sensitivity and CLI tests
        run: node --test --test-concurrency=1 dist/test/external-actions/*.test.js
      - name: 4. self-test (goldens, full baseline profile, RV1-RV6, AX1-AX7 against their pins); exit 0 = gate passed
        run: node dist/src/external-actions-cli.js self-test --out out/external-actions-a
      - name: 5. independent rerun and complete bundle byte comparison (determinism)
        run: |
          node dist/src/external-actions-cli.js self-test --out out/external-actions-b
          diff -r out/external-actions-a out/external-actions-b
      - name: 6. recorded observations re-evaluated through the CLI give the in-process evidence and report; exit 0 = full profile accepted
        run: |
          node dist/src/external-actions-cli.js evaluate --observations test/fixtures/external-actions/p1a-baseline.observations.json --profile profiles/external-actions/p1a-synthetic.profile.json --out out/external-actions-recorded
          cmp out/external-actions-recorded/evidence.jsonl out/external-actions-a/baseline/evidence.jsonl
          cmp out/external-actions-recorded/report.json out/external-actions-a/baseline/report.json
          cmp out/external-actions-recorded/observations.json test/fixtures/external-actions/p1a-baseline.observations.json
      - name: 7. report schema validation
        run: |
          node dist/src/external-actions-cli.js validate-report --file out/external-actions-a/baseline/report.json
          node dist/src/external-actions-cli.js validate-report --file out/external-actions-recorded/report.json
      - name: upload external-actions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-actions-p1a-node${{ matrix.node }}
          path: |
            out/external-actions-a/**
            out/external-actions-recorded/**
          if-no-files-found: warn

  revocation-runtime:
    name: revocation runtime adapter (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 1. declared-profile run against the pinned runtime (lock verified fail closed, SUT baseline reproduced); exit 3 = profile accepted, not a contract pass
        run: |
          set +e
          node dist/src/revocation-cli.js run-adapter --lock sut.revocation.lock.json --profile profiles/revocation/acs-guardrail-demo-ef775db.profile.json --out out/revocation-runtime-a --verify-baseline
          code=$?
          set -e
          test "$code" -eq 3
      - name: 2. independent rerun, complete bundle byte comparison, committed fixture comparison
        run: |
          set +e
          node dist/src/revocation-cli.js run-adapter --lock sut.revocation.lock.json --profile profiles/revocation/acs-guardrail-demo-ef775db.profile.json --out out/revocation-runtime-b --verify-baseline
          code=$?
          set -e
          test "$code" -eq 3
          diff -r out/revocation-runtime-a out/revocation-runtime-b
          cmp out/revocation-runtime-a/observations.json test/fixtures/revocation-runtime/ef775db-baseline-observations.json
      - name: 2b. recorded observations re-evaluated without the SUT give the same evidence, acceptance fields and exit 3
        run: |
          set +e
          node dist/src/revocation-cli.js evaluate --observations out/revocation-runtime-a/observations.json --lock sut.revocation.lock.json --profile profiles/revocation/acs-guardrail-demo-ef775db.profile.json --out out/revocation-recorded
          code=$?
          set -e
          test "$code" -eq 3
          cmp out/revocation-runtime-a/evidence.jsonl out/revocation-recorded/evidence.jsonl
          cmp out/revocation-runtime-a/supplement-evidence.jsonl out/revocation-recorded/supplement-evidence.jsonl
          cmp out/revocation-runtime-a/observations.json out/revocation-recorded/observations.json
          node -e "const a=require('./out/revocation-runtime-a/report.json'),b=require('./out/revocation-recorded/report.json');for(const k of ['counts','technically_valid','has_confirmed_violation','contract_acceptance_passed','profile_acceptance_passed','supplement_acceptance_passed'])if(JSON.stringify(a[k])!==JSON.stringify(b[k])){console.error('differs: '+k);process.exit(1)}"
      - name: 2c. earlier pin (a682e44, format 1) recorded observations re-evaluated unchanged under its historical lock; exit 3
        run: |
          set +e
          node dist/src/revocation-cli.js evaluate --observations test/fixtures/revocation-runtime/a682e44-baseline-observations.json --lock profiles/revocation/history/sut.revocation.a682e44.lock.json --profile profiles/revocation/acs-guardrail-demo-a682e44.profile.json --out out/revocation-recorded-a682e44
          code=$?
          set -e
          test "$code" -eq 3
          cmp out/revocation-recorded-a682e44/observations.json test/fixtures/revocation-runtime/a682e44-baseline-observations.json
      - name: 2d. earlier pin (a9deab6, format 2) recorded observations re-evaluated unchanged under its historical lock; exit 3
        run: |
          set +e
          node dist/src/revocation-cli.js evaluate --observations test/fixtures/revocation-runtime/a9deab6-baseline-observations.json --lock profiles/revocation/history/sut.revocation.a9deab6.lock.json --profile profiles/revocation/acs-guardrail-demo-a9deab6.profile.json --out out/revocation-recorded-a9deab6
          code=$?
          set -e
          test "$code" -eq 3
          cmp out/revocation-recorded-a9deab6/observations.json test/fixtures/revocation-runtime/a9deab6-baseline-observations.json
          node -e "const r=require('./out/revocation-recorded-a9deab6/report.json');if(r.counts.in_profile!==17||r.counts.PASS!==17||r.counts.not_assessed_requirements!==43){console.error(JSON.stringify(r.counts));process.exit(1)}"
      - name: 3. tests against the pinned runtime (no skips allowed)
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap dist/test/revocation/runtime-sut.test.js | tee out/revocation-runtime-sut.tap
          grep -q '^# skipped 0$' out/revocation-runtime-sut.tap
          grep -q '^# fail 0$' out/revocation-runtime-sut.tap
        env:
          ACE_REVOCATION_WORK: ${{ github.workspace }}/.work/revocation
      - name: 4. SUT mutants (26 with exact witnesses, M25-overreach included, 6 masked legacy-path mutants pinned to the control, M25 not run with its recorded conflict) and adapter mutants AM1-AM19; exit 0 = every mutant detected and every masking pin holds
        run: node dist/src/revocation-cli.js mutants --lock sut.revocation.lock.json --profile profiles/revocation/acs-guardrail-demo-ef775db.profile.json --out out/revocation-mutants
      - name: 4b. mutant gate regressions G1-G8 (real pinned runtime; unchanged M1 and M10 detected, M8 masked; a malformed observation in another case, an extra timeout, another error beside M4's predeclared one, a masked run that differs or a setup failure rejected as technical)
        run: node dist/scripts/mutant-gate-regressions.js --out out/revocation-mutant-gate-regressions.json
      - name: 5. evaluator regression gate (0.3.0 step path unchanged)
        run: node dist/scripts/revocation-regressions.js --out out/revocation-regressions.json
      - name: upload revocation runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revocation-runtime-node${{ matrix.node }}
          path: |
            out/revocation-runtime-a/**
            out/revocation-runtime-sut.tap
            out/revocation-mutants/mutants.json
            out/revocation-mutants/manifest.json
            out/revocation-mutant-gate-regressions.json
            out/revocation-regressions.json
          if-no-files-found: warn

  revocation-runtime-gates:
    name: revocation runtime-own gate ${{ matrix.gate }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        gate: [tenant, ancestor, regressions, lifecycle, lifecycle_regressions, lifecycle_determinism]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: runtime-own mutant gate of the pinned SUT compared with the lock (runtime-own evidence; never corpus or supplement evidence); exit 0 = matches the lock
        run: node dist/src/revocation-cli.js runtime-gates --lock sut.revocation.lock.json --gates ${{ matrix.gate }} --out out/revocation-runtime-gates
      - name: upload runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revocation-runtime-gates-${{ matrix.gate }}-node${{ matrix.node }}
          path: out/revocation-runtime-gates/**
          if-no-files-found: warn

  external-actions-p1b:
    name: external actions P1b local reference run (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 1. typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: 2. unprivileged P1b tests (plans, guard rules, patch confinement, keep-alive group window, run validity, canonical form, gate regressions)
        run: node --test --test-concurrency=1 dist/test/external-actions/p1b.test.js
      - name: 3. host setup (three system users) and environment check before any case; a failed check is exit 2, never a skip
        run: |
          sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-setup-host
          sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-env-check
      - name: 4. control run A with the reference guard over the full P1b profile; exit 0 = every case PASS
        run: |
          mkdir -p out/p1b
          sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-run --guard reference --out out/p1b/a
      - name: 5. control run B from a clean environment; canonical comparison (raw observations kept unchanged)
        run: |
          sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-run --guard reference --out out/p1b/b
          node dist/src/external-actions-cli.js p1b-compare --a out/p1b/a --b out/p1b/b
      - name: 6. the same raw observations through the recorded CLI give the in-process evidence, report and canonical form
        run: |
          node dist/src/external-actions-cli.js p1b-evaluate --run out/p1b/a --out out/p1b/a-recorded
          cmp out/p1b/a/evidence.jsonl out/p1b/a-recorded/evidence.jsonl
          cmp out/p1b/a/report.json out/p1b/a-recorded/report.json
          cmp out/p1b/a/canonical.json out/p1b/a-recorded/canonical.json
      - name: 7. report schema validation
        run: |
          for r in out/p1b/a/report.json out/p1b/b/report.json out/p1b/a-recorded/report.json; do node dist/src/external-actions-cli.js validate-report --file "$r"; done
      - name: 8. XM mutant runs, each over the full profile (exit codes are judged by the gate)
        run: |
          mkdir -p out/p1b/gate
          cp -r out/p1b/a out/p1b/gate/reference
          for m in XM5 XM6a XM6b XM7 XM9 XM10 XM11 XM12 XM13a XM13b; do
            set +e
            sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-run --guard "$m" --out "out/p1b/gate/$m" > "out/p1b/gate/$m.stdout"
            echo "$m exit $?"
            set -e
          done
      - name: 9a. precheck output (observed pins and deviations; never a pass)
        run: |
          set +e
          node dist/src/external-actions-cli.js p1b-gate --runs out/p1b/gate --out out/p1b/gate-precheck.json --precheck true
          node -e "const g=require('./out/p1b/gate-precheck.json');console.log('PRECHECK control '+JSON.stringify(g.control.pins));for(const m of g.mutants)console.log('PRECHECK '+m.id+' '+JSON.stringify({pins:m.pins,deviations:m.deviations_observed,changed:m.changed_cases}))"
          exit 0
      - name: 9b. mutant gate over the whole run (inventory, control, declared witnesses, other changed cases, technical errors); exit 0 = gate passed
        run: node dist/src/external-actions-cli.js p1b-gate --runs out/p1b/gate --out out/p1b/gate.json
      - name: 10. privileged regressions PR1-PR7 (missing isolation, writable or missing channel, failed closure, effect beside cleanup, retry state) and control-run checks
        run: sudo "$(command -v node)" dist/src/external-actions-cli.js p1b-regressions --out out/p1b/regressions --control out/p1b/a
      - name: diagnostics (summary and every non-PASS case's errors, findings and gaps)
        if: always()
        run: |
          for d in out/p1b/a out/p1b/b; do
            [ -f "$d/summary.md" ] && cat "$d/summary.md"
            [ -f "$d/evidence.jsonl" ] && node -e "for (const l of require('fs').readFileSync('$d/evidence.jsonl','utf8').split('\n').filter(Boolean)) { const e = JSON.parse(l); if (e.verdict !== 'PASS') console.log(e.case_id, e.verdict, JSON.stringify({ errors: e.errors, incomplete: e.incomplete, notes: e.closure.notes }).slice(0, 4000)); }"
          done
          [ -f out/p1b/a/run.log ] && tail -c 20000 out/p1b/a/run.log || true
      - name: upload P1b evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-actions-p1b-node${{ matrix.node }}
          path: |
            out/p1b/**
          if-no-files-found: warn
